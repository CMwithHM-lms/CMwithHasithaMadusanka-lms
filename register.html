  <h1 id="wel" aria-label="WELCOME"><span id="typed"></span><span class="cur"></span></h1>
  <p class="sub">COMBINED MATHS with Hasitha Madusanka</p>

  <form id="form" novalidate>
    <div class="f" data-f="name"><label for="name">නම <small>Full Name</small></label>
      <div class="in"><input id="name" type="text" autocomplete="name" placeholder="example: Nimshani Minulya"></div></div>

    <div class="f" data-f="school"><label for="school">පාසල <small>School</small></label>
      <div class="in"><input id="school" type="text" placeholder="Your school name"></div></div>

    <div class="f" data-f="phone"><label for="phone">දුරකථන අංකය <small>Phone Number (Login)</small></label>
      <div class="in"><input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="07XXXXXXXX" maxlength="10"></div></div>

    <div class="f" data-f="email"><label for="email">විද්‍යුත් තැපෑල <small>Email</small></label>
      <div class="in"><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div></div>

    <div class="f" data-f="address"><label for="address">ලිපිනය <small>Address</small></label>
      <div class="in"><textarea id="address" rows="2" maxlength="200" autocomplete="street-address" placeholder="House No, Street, Town"></textarea></div></div>

    <div class="f" data-f="district"><label for="district">දිස්ත්‍රික්කය <small>District</small></label>
      <div class="in"><select id="district" required><option value="" selected disabled>Select district</option></select></div></div>

    <div class="f" data-f="town"><label for="town">නගරය <small>Town</small></label>
      <div class="in"><input id="town" type="text" autocomplete="address-level2" placeholder="Your town"></div></div>

    <div class="f" data-f="year"><label for="year">උසස් පෙළ වර්ෂය <small>A/L Year</small></label>
      <div class="in"><select id="year" required><option value="" selected disabled>Select year</option>
        <option>2026</option><option>2027</option><option>2028</option><option>2029</option></select></div></div>

    <div class="f" data-f="attempt"><label for="attempt">උත්සාහය <small>Attempt</small></label>
      <div class="in"><select id="attempt" required><option value="" selected disabled>Select attempt</option><option>1st Shy</option><option>2nd Shy</option><option>3rd Shy</option></select></div></div>

    <div class="f" data-f="inst"><label for="inst">ආයතනය <small>Institute</small></label>
      <div class="in"><select id="inst" required><option value="" selected disabled>Select institute</option>
        <option>පැනෝලා - මතුගම</option><option>විදුල - හොරණ</option><option>සක්යා - පානදුර</option><option>රසන්යා - කලුතර</option><option>ONLINE</option></select></div></div>

    <div class="f" data-f="wa">
      <div class="lbl"><label for="wa">WhatsApp අංකය <small>Number</small></label><button type="button" class="link-btn" id="same">දුරකථන අංකයමයි | Same</button></div>
      <div class="in"><input id="wa" type="tel" inputmode="numeric" placeholder="07XXXXXXXX" maxlength="10"></div></div>

    <div class="f" data-f="pass"><label for="pass">මුරපදය <small>Password</small></label>
      <div class="in"><input id="pass" type="password" autocomplete="new-password" placeholder="••••••••"><button type="button" class="eye-btn" id="eye" aria-label="Show or hide password">Show</button></div>
      <div class="meter" id="meter" data-lv="0"><i></i><i></i><i></i><i></i><i></i></div>
      <ul class="rules" id="rules">
        <li data-r="len"><b></b>8+ Characters</li>
        <li data-r="up"><b></b>Uppercase letter</li>
        <li data-r="low"><b></b>Lowercase letter</li>
        <li data-r="num"><b></b>Numeric digit</li>
        <li data-r="sym"><b></b>Special symbol</li>
      </ul>
      <div class="secure" id="secure"><span class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Password verified</div></div>

    <div class="err" id="err" role="alert"></div>
    <button class="btn" id="go" type="submit">Register / ලියාපදිංචි වන්න</button>
  </form>

  <p class="row">Already Account? <a href="index.html">Log in</a></p>
  <p class="pw">POWERED BY ©Aurora</p>
