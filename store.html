<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lesson Store | COMBINED MATHS with Hasitha Madusanka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="scene.css">
<link rel="stylesheet" href="store.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c8963a">
</head>
<body data-page="store">
<main class="swrap">

  <!-- animated title -->
  <header class="shero">
    <svg class="sbag" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset=".5" stop-color="#f2c46d"/><stop offset="1" stop-color="#c8963a"/></linearGradient>
        <linearGradient id="sbv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
        <linearGradient id="sbt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
      </defs>
      <g class="bagall">
        <rect class="bk b1" x="31" y="14" width="15" height="34" rx="3" fill="url(#sbv)"/>
        <rect class="bk b2" x="49" y="20" width="15" height="28" rx="3" fill="url(#sbt)"/>
        <path d="M36 44v-4a14 14 0 0 1 28 0v4" fill="none" stroke="#a8761f" stroke-width="5" stroke-linecap="round" transform="translate(0 6)"/>
        <rect x="20" y="42" width="60" height="46" rx="14" fill="url(#sbg)"/>
        <path d="M32 60c6 6 30 6 36 0" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3.5" stroke-linecap="round"/>
        <path class="shn" d="M26 50l8-6" stroke="#fff" stroke-opacity=".8" stroke-width="3" stroke-linecap="round"/>
      </g>
      <path class="sp s1" d="M84 22l2.2 5.6 5.6 2.2-5.6 2.2L84 37.6l-2.2-5.6-5.6-2.2 5.6-2.2z" fill="#f2c46d"/>
      <path class="sp s2" d="M14 30l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#7c3aed"/>
      <path class="sp s3" d="M88 66l1.4 3.4 3.4 1.4-3.4 1.4-1.4 3.4-1.4-3.4-3.4-1.4 3.4-1.4z" fill="#14b8a6"/>
    </svg>
    <div class="stt2">
      <h1 class="stitle">Lesson Store</h1>
      <p class="ssub">Pick your class, pay and upload. Start learning.</p>
    </div>
  </header>

  <!-- Classes / Store bar with the small filter in front -->
  <div class="sbarw">
    <div class="sbar glass">
      <button class="fbtn" id="fbtn" aria-label="Filter" aria-haspopup="true" aria-expanded="false"><i data-ic="filter"></i><span class="fdot" id="fdot" hidden></span></button>
      <div class="seg" id="tabs" style="--i:0;--n:2" role="tablist">
        <span class="thumb"></span>
        <button role="tab" class="on" data-tab="classes" aria-selected="true"><i data-ic="classes"></i>Classes</button>
        <button role="tab" data-tab="store" aria-selected="false"><i data-ic="store"></i>Store</button>
      </div>
    </div>

    <div class="fpop glass" id="fpop" hidden role="dialog" aria-label="Filter">
      <div class="fl">Class type</div>
      <div class="seg" id="modeSeg" style="--i:0;--n:2">
        <span class="thumb"></span>
        <button class="on" data-mode="physical">Physical</button>
        <button data-mode="online">Online</button>
      </div>
      <div class="fl">Exam year (A/L)</div>
      <div class="yrs" id="yrs"></div>
      <label class="tgl"><span>Only my enrolments</span><input type="checkbox" id="fmine"><i></i></label>
      <button class="ghost2" id="freset"><i data-ic="cross"></i>Reset filters</button>
    </div>
  </div>

  <div class="fsum" id="fsum"></div>

  <section id="view"></section>

  <p class="aur">POWERED BY ©Aurora</p>
</main>

<!-- class detail sheet -->
<div class="sh" id="sh" hidden>
  <div class="shb" role="dialog" aria-modal="true" aria-label="Class details">
    <div class="shh">
      <div class="shT"><b id="shTitle"></b><small id="shSub"></small></div>
      <span class="mtag" id="shTag"></span>
      <button class="xbtn" id="shX" aria-label="Close"><i data-ic="cross"></i></button>
    </div>
    <div class="cnav" id="cnav" hidden>
      <button id="back"><i data-ic="arrow" style="transform:scaleX(-1)"></i>All classes</button>
    </div>
    <div class="car" id="car"></div>
    <p class="aur in">POWERED BY ©Aurora</p>
  </div>
</div>

<!-- image zoom -->
<div class="lb" id="lb" hidden><img id="lbImg" alt=""></div>
<input type="file" id="fin" accept="image/*" hidden>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="backend.js"></script>
<script src="config.js"></script>
<script src="icons.js"></script>
<script src="core.js"></script>
<script src="staff.js"></script>
<script src="shell.js"></script>
<script src="store.js"></script>
<script src="pwa.js"></script>
</body>
</html>
